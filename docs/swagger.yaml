definitions:
  gen.Response:
    properties:
      data:
        items:
          type: integer
        type: array
    type: object
info:
  contact: {}
paths:
  /auth:
    get:
      consumes:
        - application/json
      description: Returns a success message
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/gen.Response"
      summary: Default method for auth controller
      tags:
        - Auth
  /email-reactivation:
    post:
      consumes:
        - application/json
      description: Verifies an auth token
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/gen.Response"
      summary: Auth verification method
      tags:
        - Auth
  /forgot-password:
    post:
      consumes:
        - application/json
      description: Sends a forgot password request for a user
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/gen.Response"
      summary: User forgot password method
      tags:
        - Auth
  /is-email-exists:
    post:
      consumes:
        - application/json
      description: Checks if an email exists in the system
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/gen.Response"
      summary: Check if email exists
      tags:
        - Auth
  /is-password-token-exists:
    post:
      consumes:
        - application/json
      description: Checks if a password token exists in the system
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/gen.Response"
      summary: Check if password token exists
      tags:
        - Auth
  /is-user-email-exists:
    post:
      consumes:
        - application/json
      description: Checks if a user's email exists in the system
      produces:
